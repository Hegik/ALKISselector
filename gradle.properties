# JOSM-Version, gegen die kompiliert wird und die `runJosm` startet (aktuelle "tested"-Version)
josm.version=19613
# Mindestversion von JOSM, die das Plugin voraussetzt
josm.minVersion=19613
# JOSM-Plugins, die zur Laufzeit benötigt werden (Plugin-Requires)
josm.requiredPlugins=jts

plugin.version=0.1.0
plugin.author=ALKISselector-Projekt (GIS Geländepraktikum)
# Projektseite (erscheint in der JOSM-Pluginliste), sobald ein öffentliches Repository existiert
plugin.link=https://github.com/Hegik/ALKISselector

org.gradle.jvmargs=-Dfile.encoding=UTF-8
